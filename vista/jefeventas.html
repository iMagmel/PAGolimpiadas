<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="jefeventas.css">
    <title>SkyWay Travel</title>
</head>
<body>
    <header>
        <h1>SkyWay Travel</h1>
        <nav>
            <ul>
                <li>BUSCAR</li>
                <li>AGREGAR</li>
                <li>ELIMINAR</li>
            </ul>
        </nav>
        <div class="buscador-container">
            <input type="text" class="buscador" placeholder="Buscar destino, país, excursión...">
        </div>
    </header>
   <form action="">
  <div class="registro-unico">

    <!-- Imagen centrada arriba -->
    <div class="imagen-item">
      <label class="imagen-label">
        <img src="images/brasil.jfif" alt="Imagen Lugar" />
      </label>
    </div>

    <!-- Primera fila: Num Compra y Num Pasaje -->
    <div class="fila fila-doble">
      <div class="item">
        <span>Num Compra:</span>
        <label>123456</label>
      </div>

      <div class="item">
        <span>Num Pasaje:</span>
        <label>78910</label>
      </div>
    </div>

    <!-- Segunda fila: Cantidad Pasajes, Fecha, Estado -->
    <div class="fila fila-triple">
      <div class="item">
        <span>Cantidad Pasajes:</span>
        <label>3</label>
      </div>

      <div class="item">
        <span>Fecha Compra:</span>
        <input type="date" value="2025-06-16" disabled />
      </div>

      <div class="item">
        <span>Estado Compra:</span>
        <label>Confirmado</label>
      </div>
    </div>

  </div>
</form>
</body>
</html>
