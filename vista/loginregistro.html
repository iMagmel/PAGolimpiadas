<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>login</title>
</head>
<body>
    <div class="container" id="container">
        <div class="forms-container">
            <div class="forms" id="forms">
                <form action="" id="sign-in">
                    <h2>login</h2>
                    <p>dont have an account yes? <a href="#" id="link-sing-in">sign up</a></p>
                    <div class="input-container">
                        <label for="email">email address</label>
                        <input id="email" type="email" placeholder="you@example.com">
                    </div>
                    <div class="input-container">
                        <label for="usuario">usuario</label>
                        <input id="usuario" type="usuario" placeholder="ingrese el nombre del usuario">
                    </div>
                    <div class="input-container">
                        <div class="forget">
                            <label for="password">password</label>
                            <a href="#">Forget password?</a>
                        </div>
                        
                        <input id="password" type="password" placeholder="enter 5 characters or more">
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="checkbox">
                        <label for="checkbox">Remember me</label>
                    </div>
                    <button>LOGIN</button>

                    <div class="line-width-text">
                        <span>or login with</span>
                    </div>
                    <div class="other-login">
                        <a href="#" class="google">
                            <img src="icons/google.svg" alt="">
                            <span>Google</span>  
                        </a>
                        <a href="#" class="facebook">
                            <img src="icons/facebook.svg" alt="">
                            <span>Facebook</span>  
                        </a>
                    </div>
                </form>
                <form action="" id="sign-up">
                    <h2>Register</h2>
                    <p>Already registered? <a href="#" id="link-sing-up">sign up</a></p>
                    <div class="input-container">
                        <label for="email">email address</label>
                        <input id="email" type="email" name="email" placeholder="you@example.com">
                    </div>
                    <div class="input-container">
                        <label for="usuario">usuario</label>
                        <input id="usuario" type="usuario" name="usuario" placeholder="ingrese el nombre del usuario">
                    </div>
                    <div class="input-container">
                        <label for="password">password</label>
                        <input id="password" type="password" name="password" placeholder="enter 5 characters or more">
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="checkbox">
                        <label for="checkbox">Remember me</label>
                    </div>
                    <div class="input-container">
                        <label for="cpassword"> confirme su contraseña</label>
                        <input id="password" type="password" name="cpassword" placeholder="enter 5 characters or more">
                    </div>
                    <button class="btn-register">REGISTER</button>

                   
                </form>
            </div>
        </div>
        <div class="banner">
            <div class="shape shape1"></div>
            <div class="shape shape2"></div>
            <div class="shape shape3"></div>
            <section>
                <h1>bienvenido a tu <span>proxima ruta</span> </h1>
                <p>login tu acces your account</p>
                <img src="/images/banner.svg" alt="">
            </section>
        </div>
        <div class="sidebar" id="sidebar">
            <div class="sign" id="btn-sign-in">
                <img src="icons/crown.svg" alt="">
                <span>Sign in</span>
            </div>
            <div class="sign"id="btn-sign-un">
                <img src="icons/rule.svg" alt="">
                <span>Sign up</span>
            </div>
        </div>
    </div>



    <script src="scripts.js"></script>
</body>
</html>
