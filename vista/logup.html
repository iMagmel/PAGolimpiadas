<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Registrarse | SkyWay</title>
</head>
<body>
  <div class="container" id="container">
    <div class="forms-container">
      <div class="forms" id="forms">
      
        <!-- REGISTRO -->
        <form action="" id="sign-up" class="form-register">

          <h2>Registrarse</h2>
          <p>¿Ya tenes cuenta?<a href="login.html" id="link-sing-up">Inicia sesión</a></p>

          <div class="input-container">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" placeholder="Ingrese tu nombre">
          </div>

          <div class="input-container">
            <label for="usuario">usuario</label>
            <input id="usuario" type="text" placeholder="ingrese el nombre del usuario">
          </div>

          <div class="input-container">
            <label for="sexo">Seleccione su sexo</label>
            <select name="sexo">
              <option value="" disabled selected>Seleccione su sexo</option>
              <option value="femenino">F</option>
              <option value="masculino">M</option>
              
            </select>
          </div>
          <div class="input-container">
            <label for="genero">Seleccione su genero</label>
            <select name="Genero">
              <option value="" disabled selected>Seleccione su genero</option>
              <option value="femenino">Femenino</option>
              <option value="masculino">Masculino</option>
              <option value="otro">No binario</option>
              <option value="otro">Otro </option>
            </select>
          </div>


          <div class="input-container">
            <label for="pais">Pais</label>
            <input id="pais" type="text" placeholder="Ingrese su nacionalidad">
          </div>

          <div class="input-container">
            <label for="documento">Tipo y número de documento</label>
            <select name="documento_seleccionado">
              <option value="" disabled selected>Seleccione tipo de documento</option>
              <option value="DNI">DNI</option>
              <option value="Pasaporte">Pasaporte</option>
            </select>
            <input type="number" placeholder="Ingrese el número de documento">
          </div>

          <div class="input-container">
            <label for="email">Direccion Email</label>
            <input id="email" type="email" placeholder="you@example.com">
          </div>

          <div class="input-container">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="enter 5 characters or more">
          </div>


          <div class="input-container">
            <label for="password">Confirme su contraseña</label>
            <input id="password" type="password" placeholder="enter 5 characters or more">
          </div>

          <div class="remember-me">
            <input type="checkbox" id="checkbox">
            <label for="checkbox">Mostrar contraseña</label>
          </div>

          <button for="EnviarFormulario" class="btn-sign-un"> Confirmar registro </button>
            <div >
                  <a href="index.html" class="btn-sign-un"> Volver al Inicio</a>
            </div>

        </form>
      </div>
    </div>

    <div class="banner">
      <div class="shape shape1"></div>
      <div class="shape shape2"></div>
      <div class="shape shape3"></div>
      <section>
        <h1>bienvenido a tu <span>proxima ruta</span></h1>
        <p>login tu acces your account</p>
        <img src="/images/banner.svg" alt="">
      </section>
    </div>

    <div class="sidebar" id="sidebar">
      <!-- <div class="sign" id="btn-sign-in">
        <img src="icons/crown.svg" alt="">
        <span>Sign in</span>
      </div>
      <div class="sign" id="btn-sign-un">
        <img src="icons/rule.svg" alt="">
        <span>Sign up</span>
      </div>
    </div> -->
  </div>

  <script src="scripts.js"></script>
</body>
</html>
